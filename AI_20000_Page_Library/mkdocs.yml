site_name: AI & Machine Learning Compendium
site_description: A comprehensive 20,000-page compilation covering all aspects of AI and Machine Learning
site_author: AI Master Compendium
site_url: https://your-site-url.github.io

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/enhancements.js
  - javascripts/bookmarks.js
  - javascripts/reading-history.js
  - javascripts/related-pages.js
  - javascripts/glossary.js
  - javascripts/file-viewer.js

# Enable static file serving for PDFs
extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

# Exclude the old PDF viewer file that conflicts with the PDF filename
exclude_docs: |
  Part_01_Mathematics_for_AI/2.Foundation of LLM.pdf.md

nav:
  - Home: README.md
  - "AI & ML Collection": ai/index.md
  - "Data Structures & Algorithms": dsa/index.md
  - "System Design": system_design/index.md
  - Glossary: glossary.md
