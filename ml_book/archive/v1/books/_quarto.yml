bibliography: references.bib

format:
  html:
    theme: cosmo
    css: shared/reference.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    link-external-newwindow: true
  pdf:
    documentclass: scrreprt
    papersize: a4
    toc: true
    number-sections: true
    colorlinks: true
    include-in-header:
      text: |
        \usepackage{booktabs}
        \usepackage{longtable}
        \usepackage{amsmath,amssymb}
  epub:
    toc: true
    number-sections: true
