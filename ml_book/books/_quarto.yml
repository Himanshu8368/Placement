project:
  type: book
  output-dir: _build
  resources:
    - cs249r/*.pdf
    - cs249r/*.epub

book:
  title: "Machine Learning: From Foundations to LLMs"
  subtitle: "Math, algorithms, runnable code, worked examples, exercises, and interview questions"
  author: "Himanshu Kumar"
  date: today
  repo-actions: []
  chapters:
    - index.qmd
    - preface.qmd
    - part: "Vol 1 · Part II — Mathematical Foundations"
      chapters:
        - math/01_linear_algebra.qmd
    - part: "Vol 5 · Part XV — ML Systems (CS249r)"
      chapters:
        - systems/01_using_cs249r.qmd
        - systems/02_cs249r_vol1.qmd
        - systems/03_cs249r_vol2.qmd

  # Later parts are added here as they are written (see PLAN.md §3).

bibliography: references.bib

execute:
  freeze: auto
  warning: false

jupyter: python3

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: shared/style.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    code-fold: false
    code-overflow: wrap
    html-math-method: mathjax
    fig-width: 6
    fig-height: 3.8
    crossref:
      chapters: true
  pdf:
    documentclass: scrbook
    papersize: a4
    toc: true
    number-sections: true
    colorlinks: true
    fig-width: 6
    fig-height: 3.8
    include-in-header:
      text: |
        \usepackage{amsmath,amssymb,bm}
  epub:
    toc: true
    number-sections: true
