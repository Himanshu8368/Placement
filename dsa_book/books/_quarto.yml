project:
  type: book
  output-dir: _build
  resources:
    - "*/anim/*.webp"
    - "*/anim/*.png"

book:
  title: "DSA Patterns"
  subtitle: "Data structures and algorithms for interviews and contests"
  author: "Himanshu Kumar"
  repo-actions: []
  favicon: shared/favicon.svg
  page-navigation: true
  sidebar:
    collapse-level: 1
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Outline"
        href: index.qmd#full-outline
      - text: "Problems"
        href: appendix/problem_index.qmd
      - text: "Revise"
        menu:
          - text: "Cheat sheets"
            href: appendix/cheatsheets.qmd
          - text: "Question bank"
            href: appendix/question_bank.qmd
          - text: "Glossary"
            href: appendix/glossary.qmd
      - text: "Guide"
        menu:
          - text: "How chapters work"
            href: appendix/anatomy.qmd
          - text: "Diagram gallery"
            href: appendix/gallery.qmd
  chapters:
    - index.qmd
    - preface.qmd
    # >>> generated chapters (scripts/gen_book.py; written chapters from outline.yml)
    - part: parts/part-i.qmd
      chapters:
        - foundations/001_complexity.qmd
        - foundations/002_proofs.qmd
        - foundations/003_languages.qmd
        - foundations/004_testing.qmd
    - part: parts/part-ii.qmd
      chapters:
        - arrays/005_intro_arrays.qmd
        - arrays/006_prefix_sums.qmd
        - arrays/007_hashing.qmd
        - arrays/008_two_pointers.qmd
        - arrays/009_sliding_window.qmd
        - arrays/010_sorting_tool.qmd
        - arrays/011_binary_search.qmd
        - arrays/012_sorting_algorithms.qmd
        - arrays/013_linear_time_sorting.qmd
    - part: parts/part-iii.qmd
      chapters:
        - arrays/014_intervals.qmd
        - arrays/015_partitioning.qmd
        - arrays/016_index_tricks.qmd
        - arrays/017_matrices.qmd
        - arrays/018_designing_ds.qmd
    - part: parts/part-iv.qmd
      chapters:
        - arrays/019_counting_subarrays.qmd
        - arrays/020_gcd_divisibility.qmd
        - arrays/021_mex_distinct.qmd
        - arrays/022_compression_offline.qmd
    - part: parts/part-v.qmd
      chapters:
        - arrays/023_sqrt_decomposition.qmd
        - arrays/024_mos_algorithm.qmd
        - arrays/025_multidim_prefix.qmd
    - part: parts/part-xxxii.qmd
      chapters:
        - trees/163_intro.qmd
        - trees/164_traversals.qmd
    - part: parts/part-xxxviii.qmd
      chapters:
        - graphs/199_intro.qmd
        - graphs/200_dfs.qmd
    - part: parts/part-xliii.qmd
      chapters:
        - dp/229_dp_intro.qmd
        - dp/230_one_d.qmd
        - dp/231_grid.qmd
        - dp/232_lis.qmd
        - dp/233_string.qmd
    # <<< generated chapters
  appendices:
    - appendix/anatomy.qmd
    - appendix/gallery.qmd
    - appendix/glossary.qmd
    - appendix/cheatsheets.qmd
    - appendix/question_bank.qmd
    - appendix/problem_index.qmd

website:
  back-to-top-navigation: true

bibliography: references.bib

execute:
  freeze: auto
  warning: false

jupyter: python3

format:
  html:
    theme:
      light: [cosmo, shared/theme-light.scss]
      dark: [darkly, shared/theme-dark.scss]
    css: shared/style.css
    include-after-body: shared/site_after.html
    # Code blocks have a dark background in both modes, so both use the dark syntax colours.
    highlight-style:
      light: arrow-dark
      dark: arrow-dark
    title-block-banner: true
    smooth-scroll: true
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 3
    code-copy: true
    code-fold: false
    code-overflow: wrap
    html-math-method: mathjax
    crossref:
      chapters: true
  pdf:
    documentclass: scrbook
    papersize: a4
    toc: true
    number-sections: true
    colorlinks: true
  epub:
    toc: true
    number-sections: true
