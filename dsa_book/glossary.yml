# Glossary: one entry per term. gen_book.py turns this into books/appendix/glossary.qmd,
# sorted alphabetically, each with a link to where the book introduces it.
#   term: the word as the book uses it
#   def:  one or two plain sentences
#   see:  a section label (sec-...) where the term is introduced; a missing label is reported and dropped
- term: Adjacency list
  def: >-
    A graph stored as, for every vertex, the list of its neighbours. Uses O(V + E) memory and lists the neighbours of a vertex in time proportional to its degree.
  see: sec-gr-store
- term: Amortized cost
  def: >-
    The average cost per operation over any sequence of operations, as opposed to the worst cost of a single one. A dynamic array's append is O(1) amortized even though one append can copy everything.
  see: sec-cx-amortized
- term: Anti-hash test
  def: >-
    An input built so that many keys collide in a particular hash table implementation, turning expected O(1) lookups into O(n). Defeated by a randomised hash.
  see: sec-hash-anti
- term: Back edge
  def: >-
    In a DFS, an edge to an ancestor that is still on the stack (grey). A directed graph has a cycle exactly when its DFS finds a back edge.
  see: sec-df-tree
- term: Big-O
  def: >-
    f = O(g) means f grows no faster than a constant times g for large inputs. It is an upper bound, not an exact count.
  see: sec-cx-notation
- term: Boyer–Moore voting
  def: >-
    A one-pass, O(1)-memory way to find the element that appears more than n/2 times, by pairing off different values.
  see: sec-hash-vote
- term: Difference array
  def: >-
    The array of differences d[i] = a[i] − a[i−1]. Adding v to a whole range of a becomes two point updates on d; a prefix sum turns d back into a.
  see: sec-pref-diff
- term: DFS tree
  def: >-
    The tree formed by the edges a depth-first search follows to discover new vertices. Every other edge is a back, forward or cross edge relative to it.
  see: sec-df-tree
- term: Dynamic programming
  def: >-
    Solving a problem by naming subproblems (states), writing how each one follows from smaller ones (transitions), and computing each state once.
  see: sec-dpi-what
- term: Edit distance
  def: >-
    The fewest insertions, deletions and substitutions that turn one string into another. A path in the prefix grid of the two strings.
  see: sec-st-p2
- term: Entry and exit times
  def: >-
    The moments a DFS first reaches a vertex and finishes it. u is an ancestor of v exactly when u's interval contains v's.
  see: sec-df-time
- term: Exchange argument
  def: >-
    A proof that a greedy choice is safe: take any optimal solution that differs from the greedy one and swap parts of it toward the greedy choice without making it worse.
  see: sec-pf-greedy
- term: Functional graph
  def: >-
    A directed graph in which every vertex has exactly one outgoing edge. Every walk eventually enters a cycle (a "rho" shape).
  see: sec-gr-p5
- term: Half-open range
  def: >-
    The range [l, r) that includes l and excludes r. Its length is r − l and two adjacent ranges [a, b) and [b, c) share no element, which removes most off-by-one errors.
  see: sec-arr-ranges
- term: Invariant
  def: >-
    A statement that is true before a loop starts and stays true after every iteration. At the end it, together with the exit condition, gives the result.
  see: sec-pf-invariants
- term: Kadane's algorithm
  def: >-
    The O(n) maximum-subarray scan that keeps the best sum of a subarray ending at the current index.
  see: sec-dpi-p5
- term: Level-order traversal
  def: >-
    Visiting a tree level by level with a queue. One round of the queue (its size at the start of the round) is exactly one level.
  see: sec-tv-level
- term: Longest common subsequence
  def: >-
    The longest sequence that appears, in order but not necessarily contiguously, in both of two strings. Computed on the grid of their prefixes.
  see: sec-st-p1
- term: Longest increasing subsequence
  def: >-
    The longest strictly increasing subsequence of an array. O(n²) by DP over the last element, O(n log n) with the tails array and binary search.
  see: sec-lis-p1
- term: Loop invariant
  def: >-
    See Invariant.
  see: sec-pf-invariants
- term: Memoisation
  def: >-
    Top-down DP: a recursive function that stores each result the first time it is computed and returns the stored value afterwards.
  see: sec-dpi-styles
- term: Monotonic deque
  def: >-
    A deque whose values stay sorted, used to keep the minimum or maximum of a sliding window in O(1) amortized per step.
  see: sec-od-fast
- term: Monovariant
  def: >-
    A quantity that only moves in one direction as a process runs. If it is bounded, the process must stop.
  see: sec-pf-process
- term: Morris traversal
  def: >-
    An inorder traversal with O(1) extra memory that temporarily threads the tree through right pointers of predecessors, then restores it.
  see: sec-tv-morris
- term: Pigeonhole principle
  def: >-
    If more than n items go into n boxes, some box holds two. Used to prove that a repeat, a cycle or a collision must exist.
  see: sec-pf-contradiction
- term: Prefix sum
  def: >-
    The array P with P[i] = a[0] + … + a[i−1]. Any range sum becomes P[r] − P[l] in O(1).
  see: sec-pref-def
- term: Recurrence
  def: >-
    An equation that gives the cost (or the value) on an input of size n from its values on smaller inputs, such as T(n) = 2T(n/2) + n.
  see: sec-cx-recurrences
- term: Serialisation
  def: >-
    Writing a tree as a string, including markers for missing children, so that it can be rebuilt exactly. Equal subtrees then get equal strings or ids.
  see: sec-tv-ser
- term: State
  def: >-
    In DP, the smallest description of a subproblem that still determines its answer, such as "the best result for the first i items".
  see: sec-dpi-recipe
- term: Stress test
  def: >-
    Running a fast solution and a brute force on many small random inputs and stopping at the first disagreement.
  see: sec-test-stress
- term: Tabulation
  def: >-
    Bottom-up DP: filling the table in an order in which every state's dependencies are already computed.
  see: sec-dpi-styles
- term: Topological order
  def: >-
    An order of the vertices of a DAG in which every edge goes forward. A DP's states must be computed in such an order of its dependency graph.
  see: sec-df-box
- term: Two pointers
  def: >-
    Two indices that only move forward (or toward each other), so the scan costs O(n) in total even though it considers pairs.
  see: sec-tp-inv
- term: Pull and push
  def: >-
    Two directions for the same DP. Pull computes dp[i] from cells already final; push stands at i and writes into every cell it reaches. Same dependency graph, different loop.
  see: sec-od-dir
- term: Partition DP
  def: >-
    A DP over where the last block of a cut starts: dp[i] = best over j of dp[j] + cost(j, i). The block [j, i) is half-open.
  see: sec-od-part
- term: Weighted interval scheduling
  def: >-
    Pick non-overlapping intervals of maximum total weight. Sort by end; dp[i] = max(skip i, take i plus the best ending before i starts).
  see: sec-od-p2
- term: Rolling array
  def: >-
    Keeping only the rows of a DP table that the next row reads, so a 2D table costs O(width) memory.
  see: sec-gd-mem
- term: Tails array
  def: >-
    In the O(n log n) LIS, tails[k] is the smallest possible last value of an increasing subsequence of length k + 1. It stays sorted, so each element is placed by binary search.
  see: sec-lis-p1
- term: Antichain
  def: >-
    A set of elements no two of which are comparable. Dilworth's theorem: the fewest chains covering a poset equals its largest antichain.
  see: sec-lis-chain
- term: Alignment
  def: >-
    A way to line up two strings with gaps; each alignment is a monotone path in the grid of their prefixes, so edit distance and LCS are shortest/longest paths.
  see: sec-st-align
- term: Automaton DP
  def: >-
    A DP whose state includes the state of an automaton reading a pattern (KMP or a trie), used to count or build strings that avoid or contain a pattern.
  see: sec-st-auto
- term: Degree
  def: >-
    The number of edges at a vertex (in-degree and out-degree in a directed graph). The degrees sum to twice the number of edges.
  see: sec-gr-p1
- term: Flood fill
  def: >-
    Marking every cell connected to a start cell in a grid by DFS or BFS: a grid is a graph whose edges are the neighbouring cells.
  see: sec-gr-p3
- term: Implicit graph
  def: >-
    A graph that is never stored: its vertices are states (a number, a board, a string) and its edges are the legal moves, generated on the fly.
  see: sec-gr-p4
- term: Tree
  def: >-
    A connected graph with no cycle; equivalently, n vertices and n − 1 edges and connected. There is exactly one path between any two vertices.
  see: sec-tr-what
- term: Parent array
  def: >-
    A rooted tree stored as parent[v] for every vertex (−1 for the root). Enough to walk up, and to compute subtree values in reverse BFS order.
  see: sec-tr-p4
- term: Rooting a tree
  def: >-
    Choosing a root in an edge list and orienting every edge away from it by one DFS or BFS, which gives parents, depths and subtrees.
  see: sec-tr-p6
- term: Subtree aggregation
  def: >-
    Computing a value for every subtree (size, sum, height) in post-order: a vertex's value combines its children's values.
  see: sec-df-p2
- term: Backtracking
  def: >-
    DFS over partial solutions: extend the current choice, recurse, then undo it. Pruning cuts branches that cannot lead to an answer.
  see: sec-df-p4
- term: Master theorem
  def: >-
    The solution of T(n) = aT(n/b) + f(n), found by comparing f(n) with n^(log_b a): the leaves dominate, the levels balance (an extra log n), or the root dominates.
  see: sec-cx-recurrences
- term: Harmonic sum
  def: >-
    n/1 + n/2 + … + n/n = O(n log n): the cost of looping over the multiples of every number up to n.
  see: sec-cx-p2
- term: Read/write pointers
  def: >-
    Compacting an array in place: a read index scans every element and a write index marks where the next kept element goes.
  see: sec-arr-p2
- term: 2D prefix sum
  def: >-
    P[r][c] = the sum of the rectangle above and left of (r, c). Any rectangle sum is four lookups by inclusion–exclusion.
  see: sec-pref-2d
- term: Canonical key
  def: >-
    A normal form that equal-up-to-symmetry objects share (a sorted word for anagrams, a reduced fraction for a slope), so grouping becomes a hash-map lookup.
  see: sec-hash-keys
- term: Shrinking
  def: >-
    Reducing a failing random test to the smallest input that still fails, by deleting or simplifying parts while the bug persists.
  see: sec-test-shrinking
- term: Interactive problem
  def: >-
    A problem where the program asks a judge questions and reads its answers. Flush after every query and test against a local judge.
  see: sec-test-interactive
- term: Recurrence relation (DP)
  def: >-
    See Transition.
  see: sec-dpi-recipe
- term: Transition
  def: >-
    In DP, the formula that gives a state from smaller states, usually found by asking "what was the last decision?".
  see: sec-dpi-recipe
- term: Prefix count
  def: >-
    Prefix sums of a 0/1 indicator array, so the number of cells with a property in [l, r) is P[r] − P[l].
  see: sec-pref-def
- term: Event sweep
  def: >-
    A sparse difference array: store the +v and −v changes at range ends in a map, sort the positions, and sweep a running total. It replaces a difference array when coordinates are huge.
  see: sec-pref-diff
- term: First-index map
  def: >-
    A hash map from a prefix value to the earliest index where it occurs, used to find the longest subarray with a given sum.
  see: sec-pref-hash
- term: Load factor
  def: >-
    n/m, the average number of keys per bucket of a hash table. Tables resize when it passes a threshold, which keeps lookups expected O(1).
  see: sec-hash-sets
- term: Separate chaining and open addressing
  def: >-
    The two ways to store colliding keys: a list per bucket (chaining), or probing other slots of the same array (open addressing).
  see: sec-hash-sets
- term: Complement lookup
  def: >-
    Looking up the partner value (for example t − x) in a map of the elements seen so far, so each pair is found in one pass.
  see: sec-hash-complement
- term: Misra–Gries
  def: >-
    The generalisation of Boyer–Moore voting: k counters find every value that occurs more than n/(k+1) times, followed by one verification pass.
  see: sec-hash-vote
- term: Cache line
  def: >-
    The fixed-size block (typically 64 bytes) in which memory moves between RAM and the CPU cache. Scanning an array in order uses every byte of each line it loads.
  see: sec-arr-cache
- term: Sentinel
  def: >-
    An extra element placed at a boundary so that the boundary behaves like any other position, removing a special case from the loop.
  see: sec-arr-sentinel
- term: Stable rearrangement
  def: >-
    A rearrangement in which elements the rule does not distinguish keep their relative order (a stable sort, or compacting with read/write pointers).
  see: sec-arr-inplace
- term: Frequency array
  def: >-
    An array indexed by value that counts occurrences; it replaces a hash map when the values are small integers (after an offset for negatives).
  see: sec-arr-p5
- term: Group pointer
  def: >-
    A second index that jumps over a maximal run of equal (or related) elements, so that one piece of work settles the whole block.
  see: sec-tp-runs
- term: 3SUM conjecture
  def: >-
    The unproved assumption that 3SUM (three numbers summing to zero) has no O(n^(2−ε)) algorithm; many quadratic lower bounds are conditional on it.
  see: sec-tp-fix
- term: Gap method
  def: >-
    Merging two sorted arrays in place with O(1) extra space by comparing positions a shrinking gap apart, as in Shell sort.
  see: sec-tp-merge
- term: Strict weak ordering
  def: >-
    A "comes before" rule that is irreflexive and transitive, with transitive ties. It is what std::sort requires of a comparator; `<=` breaks it.
  see: sec-srt-a2
- term: Stable sort
  def: >-
    A sort in which elements with equal keys keep their input order, so sorting by one key and then stably by another sorts by both.
  see: sec-srt-a1
- term: Coordinate compression
  def: >-
    Replacing values by their rank among the sorted distinct values, so huge or negative values can index an array of size n.
  see: sec-srt-a4
- term: Weighted median
  def: >-
    The first value, in sorted order, whose cumulative weight reaches half the total. It minimises the sum of w_i |x_i − t|.
  see: sec-srt-p5-b
- term: Sliding window
  def: >-
    A contiguous range a[l..r] kept up to date as it moves, by adding the entering element and removing the leaving one instead of recomputing.
  see: sec-sw-a1
- term: Shrink-safe rule
  def: >-
    A window condition such that every sub-window of a valid window is also valid. It is what lets the left end move only forward, giving O(n) in total.
  see: sec-sw-a2
- term: At-most difference
  def: >-
    Counting windows with exactly k of something as atMost(k) − atMost(k − 1), because "exactly k" is not shrink-safe but "at most k" is.
  see: sec-sw-a4
- term: Monotone predicate
  def: >-
    A yes/no test whose answers over an ordered set run false … false, true … true. Binary search finds the boundary in O(log n) tests.
  see: sec-bst-a1
- term: lower_bound and upper_bound
  def: >-
    lower_bound (Python bisect_left) is the first index with a[i] ≥ x; upper_bound (bisect_right) is the first index with a[i] > x. Their difference counts the copies of x.
  see: sec-bst-a2
- term: Binary search on the answer
  def: >-
    Binary-searching a range of candidate answers instead of an array, using a monotone feasibility test (for example "can we ship within D days at capacity c?").
  see: sec-bst-a5
- term: Counting sort
  def: >-
    Sorting integer keys in [0, k) by counting each key, taking prefix sums to get each key's first position, and placing the records stably; O(n + k).
  see: sec-lts-a1
- term: LSD radix sort
  def: >-
    One stable counting sort per digit, least significant digit first; Θ(d(n + b)) for d digits in base b. Stability is what keeps earlier passes' order.
  see: sec-lts-a3
- term: MSD radix sort
  def: >-
    A counting sort on the leading digit or character, then recursion into each group; it suits strings of different lengths.
  see: sec-lts-a3-msd
- term: Bucket sort
  def: >-
    Scatter the values into equal-width buckets, sort each bucket, and concatenate; expected O(n) when the input is uniformly distributed.
  see: sec-lts-a4
- term: Decision tree (sorting)
  def: >-
    A binary tree of comparisons whose leaves are the possible output orders. It has at least n! leaves, so its height, the worst-case number of comparisons, is Ω(n log n).
  see: sec-lts-a1-wall
- term: Inversion
  def: >-
    A pair of positions i < j with a[i] > a[j]. Insertion sort does exactly one swap per inversion, and merge sort can count them in O(n log n).
  see: sec-salgo-a0
- term: Adaptive sort
  def: >-
    A sort that runs faster on input that is already partly sorted, such as insertion sort (O(n + inversions)) or Timsort (O(n) on sorted input).
  see: sec-salgo-a0
- term: Quickselect
  def: >-
    Partition around a pivot, then keep only the side that holds the target rank; expected O(n) to find the k-th smallest element.
  see: sec-salgo-a4-select
- term: Introsort
  def: >-
    Quicksort with a recursion-depth limit that switches to heapsort when exceeded and finishes small ranges with insertion sort; O(n log n) worst case. It is how std::sort is usually implemented.
  see: sec-salgo-a7
- term: Timsort
  def: >-
    A stable, adaptive merge sort that finds natural runs, extends short ones with binary insertion sort, and merges runs under a stack invariant; Python's sorted uses it.
  see: sec-salgo-a8
- term: Sweep line
  def: >-
    Turning intervals into sorted +1/−1 events and processing them left to right with a running count, so overlap questions cost O(n log n).
  see: sec-int-events
- term: Interval partitioning
  def: >-
    Assigning intervals to the fewest rooms so that no room holds two overlapping intervals; the fewest rooms equals the peak overlap.
  see: sec-int-events
- term: Stabbing set
  def: >-
    The fewest points such that every interval contains at least one. Greedy: sort by right end, and place a point at each uncovered interval's right end.
  see: sec-int-sched
- term: Three-way partition
  def: >-
    Rearranging an array into three blocks (less than, equal to, greater than a pivot) in one pass with three pointers; also called the Dutch national flag problem.
  see: sec-part-dnf
- term: Stable partition
  def: >-
    A partition that keeps the original relative order inside each block. Easy with O(n) extra space; in place it costs O(n log n) with rotations.
  see: sec-part-stable
- term: Next permutation
  def: >-
    The smallest permutation larger than the current one in lexicographic order: find the last ascent, swap with the smallest larger value to its right, reverse the suffix.
  see: sec-part-perm
- term: Lehmer code
  def: >-
    The rank of a permutation in lexicographic order, written digit by digit as the number of smaller unused values at each position.
  see: sec-part-rank
- term: Virtual index
  def: >-
    A remapping of positions (for example 1, 3, 5, …, 0, 2, 4, …) under which an ordinary partition places values into a wiggle order in place.
  see: sec-part-virtual
- term: Block-swap rotation
  def: >-
    Rotating an array by repeatedly swapping equal-length blocks; it does exactly n − gcd(n, k) swaps.
  see: sec-part-rotate-blockswap
- term: Perfect shuffle
  def: >-
    Interleaving the two halves of an array (a1 b1 a2 b2 …); doing it in place in O(n) time needs the cycle-leader method.
  see: sec-part-shuffle
- term: Row-major order
  def: >-
    Storing a matrix row after row, so cell (i, j) of an R×C grid sits at index i·C + j. Walking along a row reads memory in order.
  see: sec-mat-a1
- term: Spiral order
  def: >-
    Reading a grid by walking its outer ring and then moving the four walls inward, ring by ring.
  see: sec-mat-a2
- term: Anti-diagonal
  def: >-
    The cells with a constant value of i + j. Main diagonals have constant i − j; both make good grouping keys.
  see: sec-mat-a2
- term: Transpose
  def: >-
    Reflecting a matrix across its main diagonal, A[i][j] = M[j][i]. Transpose followed by reversing each row rotates a square matrix 90° clockwise.
  see: sec-mat-a3
- term: Rotation orbit
  def: >-
    The up-to-four cells that a quarter turn of a square matrix cycles through; rotating in place moves each orbit with one 4-cycle.
  see: sec-mat-a3
- term: Checkerboard colouring
  def: >-
    Colouring cell (i, j) by (i + j) mod 2. Every move to a side neighbour flips the colour, which gives parity arguments about paths and tilings.
  see: sec-mat-a6
- term: Fix-two-rows reduction
  def: >-
    Fixing a top and a bottom row and collapsing the band between them into column sums, so a 2D rectangle problem becomes a 1D array problem.
  see: sec-mat-a5
- term: Index-compatible array
  def: >-
    An array of length n whose values all lie in 1..n (or 0..n−1), so every value names a valid index and the array can mark or sort itself in place.
  see: sec-idx-a1
- term: Cyclic sort
  def: >-
    Swapping each value to its home index until every position holds its own value. On a permutation it uses exactly n − c swaps (c cycles), the minimum.
  see: sec-idx-a2
- term: Cycle decomposition
  def: >-
    Splitting a permutation into disjoint loops i → p[i] → p[p[i]] → … that return to their start.
  see: sec-idx-a4
- term: Parity of a permutation
  def: >-
    The parity of n − c, which equals the parity of every sequence of swaps that sorts the permutation.
  see: sec-idx-a4
- term: Order of a permutation
  def: >-
    The smallest k > 0 with p^k equal to the identity; it is the least common multiple of the cycle lengths.
  see: sec-idx-a6
- term: Scatter and gather
  def: >-
    Writing each element to the position it names (scatter, out[p[i]] = a[i]) versus reading from the position named (gather, out[i] = a[p[i]]); they apply a permutation and its inverse.
  see: sec-idx-a6
- term: Swap-with-last deletion
  def: >-
    Deleting from an unordered packed array in O(1) by moving the last element into the hole and popping; an index map is updated for the moved element.
  see: sec-ds-a1
- term: Tombstone
  def: >-
    A marker left in a deleted open-addressing slot so that probe sequences passing through it still find keys stored further along.
  see: sec-ds-a4
- term: Sparse set
  def: >-
    The Briggs–Torczon pair of arrays (dense list plus sparse index) that supports insert, delete, membership and clear in O(1), even on uninitialised memory.
  see: sec-ds-a5-sparse
- term: Counter of counters
  def: >-
    A table indexed by frequency that records how many keys (or which keys) have each count, so "maximum frequency" or "how many keys appear exactly k times" is O(1).
  see: sec-ds-a3
- term: Lazy reset
  def: >-
    Replacing a global clear with a version clock: bump the clock, and treat any cell whose stamp is older than the clock as empty.
  see: sec-ds-a5
- term: Contribution technique
  def: >-
    Computing a sum over many objects (subarrays, pairs) by swapping the order of summation: add up each element's value times the number of objects it belongs to.
  see: sec-cnt-a1
- term: Cover count
  def: >-
    The number of subarrays of an n-element array that contain index i: (i + 1)(n − i).
  see: sec-cnt-a1
- term: Complementary counting
  def: >-
    Counting the objects with a property by counting all objects and subtracting those without it.
  see: sec-cnt-comp
- term: Inclusion–exclusion
  def: >-
    |A ∪ B| = |A| + |B| − |A ∩ B|, and its generalisation with alternating signs over all intersections.
  see: sec-cnt-comp
