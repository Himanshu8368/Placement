  - roman: I
    title: Analysis and Tooling
    folder: foundations
    source: Chapters 1–4 written
    chapters:
    - num: 1
      title: Complexity Analysis
      covers: asymptotic notation (O, Ω, Θ, o, ω); loop analysis; best/worst/average; space and the recursion stack; recurrences (substitution, recursion tree, Master, Akra–Bazzi); amortized analysis; input-size
        → allowed complexity; hidden costs
      status: written
    - num: 2
      title: Proof Techniques for Algorithms
      covers: loop invariants; induction; exchange arguments; contradiction, extremal, pigeonhole; lower bounds and adversaries; process invariants
      status: written
    - num: 3
      title: Python and C++ for DSA
      covers: containers, heaps, sorting with keys, bisect, fast I/O, recursion limits, overflow, floating point, modular arithmetic, safe hashing
      status: written
    - num: 4
      title: Testing and Debugging
      covers: stress testing, random generators, shrinking, edge-case sweeps, verdicts, sanitizers, local judges for interactive problems
      status: written
  folder: foundations
