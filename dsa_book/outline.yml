# outline.yml — the single source of truth for the book's structure.
#
# volumes -> parts -> chapters. Each chapter has a global number `num` (its file is
# books/<folder>/<num:03d>_<slug>.qmd), a `title`, and `covers` (its patterns / topics).
# scripts/gen_book.py reads this file to build the sidebar, the home page and the problem index;
# scripts/new_chapter.py scaffolds a chapter from it. Edit this file, not the generated pages.
#
# Optional chapter keys:
#   status: planned (default) | drafting | written | audited   — shown on the home page and the chapter badge
#   owner:  the session/person currently editing the chapter; others must not edit it (STYLE.md, Coordination)
#   needs:  [chapter numbers] read first (default: the previous chapter of the same part)
#
# `merged` records chapters of the source LaTeX books that are not mirrored because another
# chapter owns their topic (each topic lives in exactly one chapter).

merged:
- '`array` ch. 7 (Binary Search on Arrays) → the binary-search volume'
- '`array` ch. 14 (Greedy Algorithms on Arrays) → the greedy volume'
- '`array` ch. 15 (Bitwise Operations on Arrays) → the bit-manipulation volume'
- '`array` ch. 32 (Bitsets & Word-Level Parallelism) → the bit-manipulation volume (bitsets)'
- '`array` ch. 34 (Expert Greedy & Exchange Arguments) → the greedy volume (exchange arguments)'
- '`recursion` ch. 3 (Recursion Trees, Master Theorem, Akra–Bazzi) → Chapter 1 (recurrences, master theorem, Akra–Bazzi)'
- '`recursion` ch. 5 (Tracing, Debugging, Stack Overflow) → Chapters 3–4 (recursion limits, tracing, debugging)'
- '`recursion` ch. 6 (Correctness by Induction) → Chapter 2 (correctness by induction)'
- '`recursion` ch. 18 (Divide-and-Conquer DP as a Recursive Split) → the DP volume (divide-and-conquer optimisation)'
- '`recursion` ch. 22 (Memoization as a Patch) → the DP volume (memoisation)'
- '`recursion` ch. 29 (Parallel Binary Search as Recursion) → the binary-search volume (parallel binary search)'
- '`recursion` ch. 30 (Which Recursion, Which Book) → the pattern maps of each volume'
- '`recursion` ch. 32 (D&C Optimization Expert) → the DP volume (divide-and-conquer optimisation)'
- '`sqh` ch. 4 (Invariants and Amortized Cost) → Chapter 1 (amortized analysis) and Chapter 2 (invariants)'
- '`sqh` ch. 5 (STL, Comparators, Tracing) → Chapter 3 (STL, comparators)'
- '`sqh` ch. 16 (Monotone Queue Optimization of DP) → the DP volume (monotonic-queue DP)'
- '`sqh` ch. 17 (Variable Windows and Two Pointers versus Deque) → the array volume (sliding window) and the monotonic-queue chapter'
- '`sqh` ch. 26 (Slope Trick) → the DP volume (slope trick)'
- '`string` ch. 15 (Tries and Binary Tries) → the tree volume (tries)'
- '`string` ch. 21 (Dynamic Programming on Strings) → the DP volume (string DP)'
- '`graph` ch. 13 (Tree Fundamentals) → the tree volume'
- '`graph` ch. 14 (Lowest Common Ancestor) → the tree volume'
- '`graph` ch. 15 (Subtree & Path Queries) → the tree volume'
- '`graph` ch. 16 (Heavy–Light Decomposition) → the tree volume'
- '`graph` ch. 17 (Centroid Decomposition) → the tree volume'
- '`graph` ch. 30 (Link-Cut Trees & Dynamic Forests) → the tree volume (link-cut trees)'
- '`dp` ch. 25 (Matrix Exponentiation for Linear Recurrences) → the math volume (matrices, linear recurrences)'
- '`dp` ch. 32 (Generating Functions & Polynomial (FFT/NTT) DP) → the math volume (polynomials, FFT, generating functions)'
- '`dp` ch. 33 (Berlekamp–Massey & Linear-Recurrence Tricks) → the math volume (Berlekamp–Massey, Kitamasa)'
- "`greedy` ch. 2 (First Proofs: Stays Ahead and Exchange) → Chapter 2 (stays ahead and exchange arguments)"
- '`bit` ch. 17 (Nim and XOR Games) → the math volume (impartial games and Nim)'
- '`math` ch. 12 (Linear Basis and Algebra over GF(2)) → the bit-manipulation volume (XOR basis, GF(2) elimination)'
- '`math` ch. 15 (Algebraic Graph Counting) → the graph volume (counting and algebraic graph theory)'
volumes:
- num: 1
  title: Foundations
  intro: Analysis, proofs and tooling used by every later volume. Written.
